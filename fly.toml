app = "sonora-fan"
primary_region = "gru"  # ou "iad", "ams" – mude para a sua região

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  path = "/"
  interval = "10s"
  timeout = "2s"
