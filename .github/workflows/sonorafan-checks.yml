name: SonoraFan checks
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check frontend and backend syntax
        run: |
          node --check server.js
          node --check public/sonorafan-queue-80.js
          node --check public/sonorafan-search-77.js
          node --check public/sonorafan-inline-search-78.js
          node --check public/sonorafan-mobile-music-76.js
          node --check public/sonorafan-quick-add-81.js
          node --check public/sonorafan-queue-discovery-82.js
          node --check public/sonorafan-pwa-83.js
          node --check public/admin-control-12.js
          node --check youtube-utils-81.js
          node --check sonorafan-studio-100.js
          node --check sonorafan-experience-95.js
          node --check public/sonorafan-universe-95.js
          node --check public/sonorafan-queue-tools-95.js
          node --check public/sonorafan-studio-100.js
          node --check public/sonorafan-footer-tools-106.js
          node --check public/sonorafan-lobby-107.js
          node --check sonorafan-profile-108.js
          node --check public/sonorafan-profile-108.js
          node --check public/sonorafan-profile-library-112.js
          node --check room-genres-109.js
          node --check public/sonorafan-room-genres-109.js
          node --check public/sonorafan-community-110.js
          node --check public/social-stage3.js
          node --check public/sonorafan-chat-53.js
          node --check public/sonorafan-community-71.js
      - name: Run regression tests
        run: npm test
