<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SonoraFan 117 — player test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120b17;color:white;font-family:Arial,sans-serif}
#screen-room{height:100%;width:100%;--sf88-primary:#b35cd3;--sf88-secondary:#ff995c}
</style>
<link rel="stylesheet" href="../../public/sonorafan-room-redesign-113.css">
</head><body>
<div id="screen-room" class="screen sf113-room" data-sf113-view="visual">
 <div class="player-column sf34-player-column">
  <div class="player-section">
   <div class="player-frame" style="width:640px!important;height:420px!important;aspect-ratio:auto!important;max-height:none!important">
    <iframe id="youtube-player" title="Vídeo de teste" src="about:blank"></iframe>
    <div class="sf113-visual-stage" id="sf113VisualStage">Visual</div>
    <div class="sf113-view-switch" role="group"><button data-sf113-view="visual">Visual</button><button data-sf113-view="video">Vídeo</button></div>
   </div>
   <div class="progress-section sf117-player-controls">
    <div class="sf117-progress-wrap">
     <div class="progress-bar sf117-progress-track" id="sf117ProgressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Aguardando música">
      <div class="progress-fill" id="progressFill"></div>
     </div>
     <div class="progress-time sf117-progress-times">
      <span id="currentTime">0:00</span><span id="sf117Remaining">Aguardando música</span><span id="totalTime">0:00</span>
     </div>
    </div>
    <div class="sf117-control-row">
     <div class="volume-control">
      <button id="sf117VolumeToggle" type="button" aria-pressed="false" aria-label="Silenciar áudio"><span id="volIcon" class="vol-icon">🔊</span></button>
      <input id="volumeSlider" type="range" value="80" min="0" max="100">
      <output id="volumeValue" for="volumeSlider">80%</output>
     </div>
     <div class="sf30-player-actions"><button>Favoritar</button></div>
    </div>
   </div>
  </div>
 </div>
</div>
<script>window.__volumeCalls=[];window.setVolume=v=>{document.getElementById('volumeSlider').value=String(v);window.__volumeCalls.push(v);};</script>
<script src="../../public/sonorafan-room-redesign-113.js"></script>
<script>
 const report={};
 const $=id=>document.getElementById(id);
 const btn=$('sf117VolumeToggle'),slider=$('volumeSlider');
 btn.click();
 report.mute=slider.value==='0'&&btn.getAttribute('aria-pressed')==='true'&&window.__volumeCalls[0]===0;
 btn.click();
 report.restore=slider.value==='80'&&btn.getAttribute('aria-pressed')==='false'&&window.__volumeCalls[1]===80;
 slider.value='35';slider.dispatchEvent(new Event('input',{bubbles:true}));
 report.slider=$('volumeValue').textContent==='35%'&&$('volIcon').textContent==='🔉'
   &&$('screen-room').style.getPropertyValue('--sf117-volume-pct')==='35%';
 $('currentTime').textContent='3:45';$('totalTime').textContent='4:00';
 window.sf113SetView?.('video');
 Promise.resolve().then(()=>{
  const stage=$('sf117ProgressTrack');
  const progress=Number.parseFloat($('progressFill').style.width);
  report.progress=stage.getAttribute('aria-valuenow')==='94'&&progress>93&&progress<95;
  report.remaining=$('sf117Remaining').textContent==='Faltam 0:15'
   &&stage.classList.contains('sf117-ending');
  report.theme=getComputedStyle($('progressFill')).backgroundImage.includes('linear-gradient')
   &&getComputedStyle(stage).height!=='0px';
  const zoom=Number.parseFloat($('screen-room').querySelector('.player-frame').style.getPropertyValue('--sf117-video-zoom'));
  report.video=Number.isFinite(zoom)&&zoom>=1.1&&$('screen-room').getAttribute('data-sf113-view')==='video';
  const out=document.createElement('output');
  out.dataset.sf117Test=Object.values(report).every(Boolean)?'ok':'fail';
  out.textContent=JSON.stringify(report);
  document.body.append(out);
 });
</script>
</body></html>
