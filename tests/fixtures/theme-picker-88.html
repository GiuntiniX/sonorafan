<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>SonoraFan room themes regression</title>
<script>
window.sf88test={status:'pending',updates:[],errors:[]};
window.socket={connected:true,emit:function(name,value){window.sf88test.updates.push({name,value});}};
window.toast=function(){};
window.fetch=async function(url){
 if(!url.startsWith('/themes/catalog-88.json'))throw Error('Unexpected fetch '+url);
 return {ok:true,json:async()=>[{"id":"geral","name":"Padrão · Festival","description":"Festival Terra SonoraFan com bandeiras Terra e Vivo, palco e pôr do sol","primary":"#7c3aed","secondary":"#ff6b35","bg":"#180f25","text":"#f0f0f8","emoji":"🎪","art":"/themes/final-172/indie.webp","thumbnail":"/themes/final-172/indie-thumb.webp"},{"id":"indie","name":"Indie / Festival","description":"Festival indie alternativo, com arte própria em alta definição","primary":"#c256e7","secondary":"#fb8074","bg":"#170e27","text":"#f2d9ff","emoji":"🎪","art":"/themes/final-164/indie.webp","thumbnail":"/themes/final-164/indie-thumb.webp"},{"id":"metal","name":"Heavy Metal","description":"Raios incandescentes, aço, fumaça e contraste de arena pesada","primary":"#ed3a39","secondary":"#ff9035","bg":"#130b0c","text":"#ffe4d8","emoji":"🤘","art":"/themes/final-164/metal.webp","thumbnail":"/themes/final-164/metal-thumb.webp"},{"id":"emo","name":"Emo","description":"Colagem noturna, coração costurado e desenho de zine underground","primary":"#ef54a5","secondary":"#f3e6ec","bg":"#101014","text":"#f7f3f5","emoji":"🖤","art":"/themes/final-164/emo.webp","thumbnail":"/themes/final-164/emo-thumb.webp"},{"id":"mpb","name":"MPB","description":"Sol dourado, folhagens tropicais e textura brasileira orgânica","primary":"#efb34f","secondary":"#7aca88","bg":"#182d23","text":"#fff5d8","emoji":"🌺","art":"/themes/final-164/mpb.webp","thumbnail":"/themes/final-164/mpb-thumb.webp"},{"id":"eletronica","name":"Eletrônica","description":"Horizonte synthwave, lasers ciano e pista futurista de neon","primary":"#15d7f8","secondary":"#b34dff","bg":"#0c1027","text":"#eafaff","emoji":"🪩","art":"/themes/final-164/eletronica.webp","thumbnail":"/themes/final-164/eletronica-thumb.webp"},{"id":"rock","name":"Rock Clássico","description":"Guitarra no palco, faíscas âmbar e energia de show ao vivo","primary":"#f04b42","secondary":"#edbb57","bg":"#1f1213","text":"#fff1dd","emoji":"🎸","art":"/themes/final-164/rock.webp","thumbnail":"/themes/final-164/rock-thumb.webp"},{"id":"pop","name":"Pop","description":"Universo brilhante, estrelas cromadas e reflexos de palco pop","primary":"#f264d7","secondary":"#ffb654","bg":"#271127","text":"#fff0fc","emoji":"✨","art":"/themes/final-164/pop.webp","thumbnail":"/themes/final-164/pop-thumb.webp"},{"id":"rap","name":"Rap / Hip-Hop","description":"Cidade em contraluz, grafite e movimento do hip-hop de rua","primary":"#f8a434","secondary":"#ec6667","bg":"#1c1721","text":"#ffedcc","emoji":"🎤","art":"/themes/final-171/rap.webp","thumbnail":"/themes/final-171/rap-thumb.webp"},{"id":"funk","name":"Funk","description":"Paredão de caixas, ondas de grave e festa elétrica brasileira","primary":"#ff4ba9","secondary":"#27d3d4","bg":"#1a1030","text":"#fff3fa","emoji":"🔊","art":"/themes/final-169/funk.webp","thumbnail":"/themes/final-169/funk-thumb.webp"},{"id":"pagode","name":"Pagode / Samba","description":"Roda de samba, pandeiro dourado e calor de fim de tarde","primary":"#f5bb55","secondary":"#52ca9c","bg":"#122b27","text":"#fff4dc","emoji":"🥁","art":"/themes/final-170/pagode.webp","thumbnail":"/themes/final-170/pagode-thumb.webp"},{"id":"sertanejo","name":"Sertanejo","description":"Festival SonoraFan nas montanhas, público, palco e Kombi ao pôr do sol","primary":"#ee9850","secondary":"#deb96c","bg":"#342019","text":"#fff1db","emoji":"🤠","art":"/themes/hd-175/sonorafan-sertanejo-aprovado.webp","thumbnail":"/themes/hd-175/sonorafan-sertanejo-thumb.webp"},{"id":"reggae","name":"Reggae","description":"Sol caribenho, folhagem tropical e ritmo roots acolhedor","primary":"#e7c742","secondary":"#48b875","bg":"#14271f","text":"#ffefc8","emoji":"🌴","art":"/themes/final-170/reggae.webp","thumbnail":"/themes/final-170/reggae-thumb.webp"},{"id":"jazz","name":"Jazz / Blues","description":"Clube de jazz noturno, metal dourado e iluminação azul veludo","primary":"#d4ad72","secondary":"#7ba2cf","bg":"#131c2b","text":"#fff2d8","emoji":"🎷","art":"/themes/final-170/jazz.webp","thumbnail":"/themes/final-170/jazz-thumb.webp"},{"id":"forro","name":"Forró","description":"Bandeirinhas, sanfona, luz quente e festa junina contemporânea","primary":"#ed8b4c","secondary":"#efca6a","bg":"#322019","text":"#fff1cb","emoji":"🪗","art":"/themes/final-170/forro.webp","thumbnail":"/themes/final-170/forro-thumb.webp"}]};
};
window.addEventListener('error',e=>window.sf88test.errors.push(e.message));
window.addEventListener('load',()=>setTimeout(()=>{
 try{
  window.sf88ResetCreateTheme();
  if(window.sf88GetCreateTheme()!=='geral')throw Error('default');
  document.querySelector('#sf88CreateTheme button').click();
  document.querySelector('#sf88ThemeCards [data-theme="emo"]').click();
  document.getElementById('sf88ThemeShared').click();
  if(window.sf88GetCreateTheme()!=='emo')throw Error('create selector');
  window.sf88BeginRoom('test-room');
  window.sf88RoomState({slug:'test-room',roomTheme:'metal'});
  if(document.getElementById('screen-room').dataset.roomTheme!=='metal')throw Error('shared render');
  window.sf88Permission(false);
  document.getElementById('sf88RoomThemeButton').click();
  if(document.getElementById('sf88ThemeShared').hidden!==true)throw Error('participant shared control');
  document.querySelector('#sf88ThemeCards [data-theme="emo"]').click();
  document.getElementById('sf88ThemePersonal').click();
  if(document.getElementById('screen-room').dataset.roomTheme!=='emo')throw Error('personal rendering');
  window.sf88BeginRoom('test-room');
  window.sf88RoomState({slug:'test-room',roomTheme:'metal'});
  if(document.getElementById('screen-room').dataset.roomTheme!=='emo')throw Error('personal persistence');
  window.sf88Permission(true);
  document.getElementById('sf88RoomThemeButton').click();
  document.querySelector('#sf88ThemeCards [data-theme="geral"]').click();
  document.getElementById('sf88ThemeShared').click();
  const sent=window.sf88test.updates.find(x=>x.name==='updateRoomSettings');
  if(sent?.value?.roomTheme!=='geral')throw Error('shared event');
  window.sf88RoomState({slug:'test-room',roomTheme:'geral'});
  if(document.getElementById('screen-room').hasAttribute('data-room-theme'))throw Error('shared update');
  window.sf88LeaveRoom();
  if(document.getElementById('screen-room').hasAttribute('data-room-theme'))throw Error('cleanup');
  finish('ok');
 }catch(e){finish('failed-'+e.message);}
},250));
function finish(s){document.documentElement.setAttribute('data-sf88-test',s);}
</script>
<script defer src="../../public/sonorafan-room-themes-88.js"></script>
</head><body>
<div id="screen-room"><button type="button" id="sf88RoomThemeButton"><strong id="sf88ThemeName"></strong></button>
<div id="sf33EmptyPlayerArt"></div><div id="sf44QueueIdle"></div></div>
<div id="sf88CreateTheme"></div><div id="sf88EditTheme"></div>
<div id="sf88ThemeOverlay" hidden role="dialog" aria-modal="true">
<div id="sf88ThemeModalTitle"></div><button type="button" id="sf88ThemeClose"></button>
<div id="sf88ThemeCards"></div>
<img id="sf88ThemePreviewArt" src="../../public/themes/indie.svg"><p id="sf88ThemePreviewCopy"></p><p id="sf88ThemeCaption"></p>
<button id="sf88ThemePersonal"></button><button id="sf88ThemeShared"></button><button id="sf88ThemeReset"></button>
</div>
</body></html>
