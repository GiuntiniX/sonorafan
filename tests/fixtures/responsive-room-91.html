        radial-gradient(ellipse at 12% 0%, color-mix(in srgb, var(--accent2) 15%, transparent), transparent 38%),
        radial-gradient(ellipse at 88% 100%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 42%);
    }
    .screen.active { animation: appScreenEnter .48s var(--ui-ease) both; }
    @keyframes appScreenEnter {
      from { opacity: 0; transform: translateY(9px) scale(.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .screen .header {
      min-height: 64px; padding: 12px 22px;
      background: color-mix(in srgb, var(--bg-card) 84%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
      box-shadow: 0 8px 28px rgba(0,0,0,.10);
    }
    .header h1 { letter-spacing: -.45px; }
    .header-left > button:first-child {
      transition: transform .2s var(--ui-ease), border-color .2s, background .2s;
    }
    .header-left > button:first-child:hover {
      transform: translateX(-3px); border-color: var(--accent) !important;
      background: var(--bg-hover) !important;
    }
    .action-btn, .theme-toggle-btn, .admin-toggle-btn {
      box-shadow: inset 0 1px rgba(255,255,255,.05), 0 5px 14px rgba(0,0,0,.12);
      transition: transform .22s var(--ui-ease), box-shadow .22s, border-color .22s, background .22s;
    }
    .action-btn:hover, .theme-toggle-btn:hover, .admin-toggle-btn:hover {
      transform: translateY(-3px) rotate(-4deg) !important;
      box-shadow: 0 9px 22px var(--accent-glow);
    }

    /* Lobby: cards com profundidade e feedback */
    #screen-lobby .lobby { max-width: 1380px; padding: 30px clamp(18px,3vw,42px); }
    #screen-lobby .lobby-top { margin-bottom: 28px; }
    #screen-lobby .lobby-top h2 { font-size: clamp(23px,2vw,30px); letter-spacing: -.8px; }
    #screen-lobby .room-grid { gap: 22px; }
    #screen-lobby .room-card {
      min-height: 258px; border-radius: 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,.16);
      transform: translateZ(0);
    }
    #screen-lobby .room-card::after {
      content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 20%, transparent), transparent 48%);
      opacity: 0; transition: opacity .35s;
    }
    #screen-lobby .room-card:hover {
      transform: translateY(-7px) scale(1.012);
      border-color: color-mix(in srgb, var(--accent) 65%, var(--border));
      box-shadow: 0 24px 58px rgba(0,0,0,.32), 0 0 0 1px var(--accent-glow);
    }
    #screen-lobby .room-card:hover::after { opacity: 1; }
    #screen-lobby .room-card-body { padding: 20px 20px 19px; }
    #screen-lobby .room-card-body h3 { font-size: 19px; }
    #screen-lobby .lobby-actions button {
      border-radius: 12px; padding: 12px 18px;
      box-shadow: 0 7px 20px var(--accent2-glow);
      transition: transform .2s var(--ui-ease), box-shadow .2s;
    }
    #screen-lobby .lobby-actions button:hover {
      transform: translateY(-3px); box-shadow: 0 12px 28px var(--accent2-glow);
    }

    /* Sala: três áreas mais definidas */
    #screen-room .app {
      background:
        radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--room-accent, var(--accent2)) 9%, transparent), transparent 48%),
        var(--bg);
    }
    #screen-room .header {
      border-bottom: 1px solid color-mix(in srgb, var(--room-accent, var(--accent)) 42%, var(--border));
    }
    #screen-room .header h1 {
      font-size: 19px; letter-spacing: -.5px;
      text-shadow: 0 0 24px color-mix(in srgb, var(--room-accent, var(--accent)) 24%, transparent);
    }
    .room-layout { gap: 12px; padding: 12px; }
    .queue-column, .chat-column {
      border: 1px solid var(--border); border-radius: 18px;
      background: color-mix(in srgb, var(--bg-card) 90%, transparent);
      box-shadow: var(--panel-shadow); overflow: hidden;
    }
    .queue-column { border-right: 1px solid var(--border); }
    .chat-column { border-left: 1px solid var(--border); }
    .queue-header, .users-panel {
      min-height: 48px; padding: 12px 16px;
      background: color-mix(in srgb, var(--bg-hover) 55%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .queue-header span:first-child { color: var(--text); letter-spacing: 1px; }
    .queue-list { padding: 10px; gap: 7px; }
    .queue-item {
      padding: 10px; border: 1px solid transparent; border-left: 3px solid transparent;
      border-radius: 12px; gap: 10px;
      transition: background .22s, border-color .22s, transform .22s var(--ui-ease), box-shadow .22s;
    }
    .queue-item:hover {
      background: color-mix(in srgb, var(--bg-hover) 85%, transparent);
      border-color: var(--border); transform: translateX(3px);
    }
    .queue-item.current {
      background: linear-gradient(100deg, var(--accent-glow), color-mix(in srgb, var(--bg-hover) 75%, transparent));
      border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--border));
      border-left: 3px solid var(--accent);
      box-shadow: inset 0 0 22px color-mix(in srgb, var(--accent) 7%, transparent);
    }
    .queue-item .thumb { width: 52px; height: 39px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.22); }
    .queue-item.current .thumb { box-shadow: 0 0 0 2px var(--accent), 0 5px 16px var(--accent-glow); }
    .queue-item .info .title { font-size: 13px; }
    .queue-item.current .info .title { color: var(--text); }

    /* Player em destaque */
    .player-column {
      padding: 10px 8px 16px; gap: 14px;
      background: transparent; scrollbar-gutter: stable;
    }
    .player-section {
      border-radius: 22px;
      border-color: color-mix(in srgb, var(--accent) 22%, var(--border));
      background: linear-gradient(145deg, color-mix(in srgb, var(--bg-card) 96%, var(--accent) 4%), var(--bg-card));
      box-shadow: 0 18px 48px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.045);
    }
    .player-section.has-glow {
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--now-playing-glow) 35%, transparent),
        0 22px 65px -18px var(--now-playing-glow), 0 0 100px -34px var(--now-playing-glow);
    }
    .player-section > div:first-child {
      min-height: 43px; padding: 11px 17px !important;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent 75%);
    }
    .player-frame { overflow: hidden; }
    .player-frame iframe, .player-frame #youtube-player { transition: filter .5s; }
    #spectrum { height: 62px; }
    .player-info { padding: 17px 18px 13px; gap: 15px; }
    .cover {
      width: 78px; height: 78px; border-radius: 15px;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
      box-shadow: 0 9px 24px rgba(0,0,0,.28), 0 0 24px var(--accent-glow);
      transition: transform .35s var(--ui-ease), box-shadow .35s;
    }
    .player-section.has-glow .cover { animation: coverThrob 4s ease-in-out infinite; }
    @keyframes coverThrob {
      0%,100% { box-shadow: 0 9px 24px rgba(0,0,0,.28), 0 0 18px var(--now-playing-glow); }
      50% { box-shadow: 0 12px 28px rgba(0,0,0,.3), 0 0 32px var(--now-playing-glow); }
    }
    .track-title { font-family: var(--font-display); font-size: clamp(17px,1.5vw,21px); letter-spacing: -.45px; }
    .track-artist { font-size: 13px; margin-top: 4px; }
    .track-dj { margin-top: 5px; }
    .track-actions { gap: 7px; margin-top: 9px; }
    .track-actions button {
      padding: 7px 12px; border-radius: 999px;
      background: color-mix(in srgb, var(--bg-hover) 65%, transparent);
      transition: transform .2s var(--ui-ease), border-color .2s, color .2s, box-shadow .2s;
    }
    .track-actions button:hover {
      transform: translateY(-2px); border-color: var(--accent);
      color: var(--text); box-shadow: 0 5px 15px var(--accent-glow);
    }
    .progress-section { padding: 2px 18px 17px; }
    .progress-bar { height: 7px; background: color-mix(in srgb, var(--border) 80%, transparent); cursor: pointer; }
    .progress-fill { background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 14px var(--accent-glow); }
    .progress-fill::after { width: 13px; height: 13px; }
    .volume-control { margin-top: 13px; }
    .volume-control input[type="range"] { accent-color: var(--accent); }
    .next-track {
      padding: 12px 14px; border-radius: 14px; gap: 12px;
      background: color-mix(in srgb, var(--bg-card) 92%, transparent);
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
      transition: transform .25s var(--ui-ease), border-color .25s;
    }
    .next-track:hover { transform: translateY(-2px); border-color: var(--accent); }
    .next-track .thumb { width: 48px; height: 36px; border-radius: 7px; }
    .add-song {
      padding: 10px; border-radius: 15px; gap: 8px;
      background: color-mix(in srgb, var(--bg-card) 92%, transparent);
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
    }
    .add-song input { min-width: 0; border-radius: 11px; padding: 12px 14px; }
    .add-song input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .add-song button {
      border-radius: 11px; padding: 11px 18px;
      box-shadow: 0 6px 18px var(--accent2-glow);
      transition: transform .2s var(--ui-ease), box-shadow .2s;
    }
    .add-song button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px var(--accent2-glow); }

    /* Chat mais legível e vivo */
    .chat-column { backdrop-filter: blur(18px); }
    .users-panel .user-count {
      width: fit-content; padding: 7px 11px; border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 9%, transparent);
      color: var(--text); transition: background .2s, transform .2s;
    }
    .users-panel .user-count:hover { background: var(--accent-glow); transform: translateY(-1px); }

    @media (max-width: 420px) {

    @media (prefers-reduced-motion: reduce) {
      .screen.active, .player-section.has-glow .cover { animation: none !important; }

<script>
window.addEventListener('load',()=>{
 const $=id=>document.getElementById(id);
 const rect=e=>e.getBoundingClientRect();
 const room=$('screen-room'),app=$('app'),layout=$('roomLayout'),queue=$('queue'),player=$('player'),chat=$('chat'),request=$('request');
 const w=window.innerWidth,h=window.innerHeight;
 const error=(code)=>document.documentElement.setAttribute('data-sf91-test',code);
 const valid=e=>{const r=rect(e);return r.width>40&&r.height>25};
 const q=rect(queue),p=rect(player),ch=rect(chat),rq=rect(request),ls=rect(layout),ap=rect(app);
 const tolerance=3;
 if(!valid(layout)||!valid(player)||!valid(app))return error('missing-layout');
 if(document.documentElement.scrollWidth>document.documentElement.clientWidth+tolerance)return error('document-overflow-'+document.documentElement.scrollWidth);
 if(ap.left<-tolerance||ap.right>w+tolerance)return error('app-overflow-'+Math.round(ap.right));
 if(ls.right>w+tolerance||ls.left<-tolerance)return error('room-overflow-'+Math.round(ls.right));
 if(p.right>w+tolerance||p.left<-tolerance)return error('player-overflow-'+Math.round(p.right));
 if(ap.height>h+tolerance)return error('app-too-tall-'+Math.round(ap.height)+'-'+h);
 if(w>=900){
  if(!valid(queue)||!valid(chat)||!valid(request))return error('three-columns-missing-'+w);
  if(!(q.left+tolerance<p.left && p.left+tolerance<ch.left))return error('chat-not-beside-player-'+w+'-'+[q.left,p.left,ch.left].map(Math.round).join('-'));
  if(Math.abs(q.top-ch.top)>4||Math.abs(p.top-ch.top)>4)return error('panels-not-aligned-'+w);
  if(q.width<150||p.width<210||ch.width<170)return error('panels-too-narrow-'+w+'-'+[q.width,p.width,ch.width].map(Math.round).join('-'));
  if(ch.right>w+tolerance || ch.left<0)return error('chat-offscreen-'+w+'-'+Math.round(ch.right));
  if(!(rq.top>q.top+tolerance))return error('search-not-below-queue-'+w);
  if(layout.scrollWidth>layout.clientWidth+tolerance)return error('room-scrolls-horizontally-'+w);
 }else if(w>=769){
  if(!valid(queue)||!valid(chat)||!valid(request))return error('tablet-missing');
  if(!(p.left+tolerance<q.left&&ch.top>q.top+tolerance&&rq.top>p.top+tolerance))return error('tablet-order');
  if(p.width<240||q.width<180)return error('tablet-narrow');
 }else{
  if(p.width>w+tolerance)return error('mobile-player-too-wide');
 }
 error('ok');
});
</script></head>
